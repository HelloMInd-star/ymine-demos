    .page-header { text-align: center; padding: 40px 0 30px; }

    .page-header p { color: var(--text-secondary); font-size: 13px; margin-top: 6px; }

    .layout { display: grid; grid-template-columns: 340px 1fr; gap: 24px; padding-bottom: 60px; }
    @media (max-width: 768px) { .layout { grid-template-columns: 1fr; } }

    .control-panel { padding: 20px; }
    .panel-title { font-size: 13px; color: var(--purple); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .panel-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--purple), transparent); }

    .signal-group { margin-bottom: 14px; }
    .signal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .signal-label { font-size: 12px; font-weight: 600; }
    .signal-value { font-size: 12px; font-family: var(--font-mono); }
    .signal-desc { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

    .score-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 12px; }
    .score-label { color: var(--text-secondary); }
    .score-bar { width: 80px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.06); overflow: hidden; align-self: center; }
    .score-fill { height: 100%; border-radius: 2px; transition: width 0.4s; }

    /* 投资人卡片 */
    .investor-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
    @media (max-width: 1024px) { .investor-cards { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px) { .investor-cards { grid-template-columns: 1fr; } }

    .investor-card {
      padding: 16px; border-radius: var(--radius-md); background: var(--bg-card);
      border: 1px solid var(--border); transition: all var(--transition);
      animation: fadeIn 0.5s ease-out;
    }
    .investor-card:hover { border-color: var(--purple); }
    .investor-card .i-name { font-size: 15px; font-weight: 600; }
    .investor-card .i-en { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
    .investor-card .i-mbti { font-size: 10px; font-family: var(--font-mono); margin-bottom: 6px; }
    .investor-card .i-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
    .investor-card .i-quote { font-size: 10px; color: var(--text-secondary); font-style: italic; line-height: 1.5; margin-bottom: 8px; }
    .investor-card .i-match { font-size: 10px; color: var(--gold); font-family: var(--font-mono); }
    .investor-card .i-coord { font-size: 9px; color: var(--text-muted); font-family: var(--font-mono); margin-top: 4px; }

    /* 棋风组 */
    .temperament-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
    @media (max-width: 768px) { .temperament-grid { grid-template-columns: repeat(2, 1fr); } }
    .temp-card {
      padding: 14px; border-radius: var(--radius-md); background: var(--bg-card);

    .temp-card .t-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
    .temp-card .t-archetype { font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; }
    .temp-card .t-poem { font-size: 10px; color: var(--text-muted); font-style: italic; line-height: 1.5; }

    // 核心算法：棋风信号 → 3D 坐标
    // ═════════════════════════════════════════════════════════
    function signalsToCoordinate(sig) {
      const x = (1 - sig.openingAggression) * 0.35 + (1 - sig.moveIntuition) * 0.25 + sig.decisionLogic * 0.25 + sig.endgameDecisiveness * 0.15;
      const y = sig.openingAggression * 0.35 + sig.moveIntuition * 0.30 + (1 - sig.decisionLogic) * 0.20 + (1 - sig.endgameDecisiveness) * 0.15;
      const z = sig.openingAggression * 0.50 + (1 - sig.endgameDecisiveness) * 0.35 + sig.moveIntuition * 0.15;
      return { x: clamp(x, 0, 1), y: clamp(y, 0, 1), z: clamp(z, 0, 1) };
    }

    function classifyPiece(coord) {
      for (const p of CHESS_PIECES) {
        const b = p.boundary;
        if (b.yMax != null && coord.y > b.yMax) continue;
        if (b.yMin != null && coord.y < b.yMin) continue;
        if (b.xMax != null && coord.x > b.xMax) continue;
        if (b.xMin != null && coord.x < b.xMin) continue;
        if (b.zMax != null && coord.z > b.zMax) continue;
        if (b.zMin != null && coord.z < b.zMin) continue;
        return p;
      }
      return CHESS_PIECES[0]; // 默认 Rook
    }

    function signalsToTemperament(sig) {
      const nf = sig.moveIntuition * (1 - sig.decisionLogic);
      const nt = sig.moveIntuition * sig.decisionLogic;
      const sj = (1 - sig.moveIntuition) * sig.endgameDecisiveness;
      const sp = (1 - sig.moveIntuition) * (1 - sig.endgameDecisiveness);
      const max = Math.max(nf, nt, sj, sp);
      const id = max === nf ? 'NF' : max === nt ? 'NT' : max === sj ? 'SJ' : 'SP';
      return CHESS_TEMPERAMENTS.find(t => t.id === id);
    }

    function matchInvestors(coord) {
      return INVESTORS.map(inv => {
        const dx = coord.x - inv.coordinate.x;
        const dy = coord.y - inv.coordinate.y;
        const dz = coord.z - inv.coordinate.z;
        const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
        return { ...inv, distance: dist, score: 1 - dist / Math.sqrt(3) };
      }).sort((a, b) => a.distance - b.distance);
    }

    // ═════════════════════════════════════════════════════════
    // 初始化
    // ═════════════════════════════════════════════════════════
    const DEFAULT_SIGNALS = { openingAggression: 0.3, moveIntuition: 0.88, decisionLogic: 0.92, endgameDecisiveness: 0.85 };
    let currentSignals = { ...DEFAULT_SIGNALS };

    const signalsEl = $('#signals');
    SIGNAL_DEFS.forEach(def => {
      const div = document.createElement('div');
      div.className = 'signal-group';
      div.innerHTML = `
        <div class="signal-header">
          <span class="signal-label" style="color:${def.color}">${def.label} <small>${def.dim}</small></span>
          <span class="signal-value" style="color:${def.color}" id="val-${def.key}">${currentSignals[def.key].toFixed(2)}</span>
        </div>
        <input type="range" min="0" max="1" step="0.01" value="${currentSignals[def.key]}" data-key="${def.key}">
        <div class="signal-desc">${def.poleA} ↔ ${def.poleB} · ${def.desc}</div>
      `;
      signalsEl.appendChild(div);
    });

    signalsEl.addEventListener('input', (e) => {
      if (e.target.type === 'range') {
        const key = e.target.dataset.key;
        currentSignals[key] = parseFloat(e.target.value);
        const valEl = document.getElementById('val-' + key);
        if (valEl) valEl.textContent = currentSignals[key].toFixed(2);
      }
    });

    $('#btn-random').addEventListener('click', () => {
      SIGNAL_DEFS.forEach(def => {
        currentSignals[def.key] = Math.round(Math.random() * 100) / 100;
        const input = document.querySelector(`input[data-key="${def.key}"]`);
        if (input) input.value = currentSignals[def.key];
        const valEl = document.getElementById('val-' + def.key);
        if (valEl) valEl.textContent = currentSignals[def.key].toFixed(2);
      });
    });

    $('#btn-match').addEventListener('click', () => match());

    // 预设
    const ALL_MBTI = ['INTJ','INTP','ENTJ','ENTP','INFJ','INFP','ENFJ','ENFP','ISTJ','ISFJ','ESTJ','ESFJ','ISTP','ISFP','ESTP','ESFP'];
    const presetsEl = $('#presets');
    ALL_MBTI.forEach(mbti => {
      const btn = document.createElement('button');
      btn.className = 'tag';
      btn.textContent = mbti;
      btn.style.cursor = 'pointer';
      btn.addEventListener('click', () => {
        const style = MBTI_INVEST_STYLES[mbti];
        const temp = signalsToTemperament({ openingAggression: 0.5, moveIntuition: 0.5, decisionLogic: 0.5, endgameDecisiveness: 0.5 });
        // 根据 MBTI 字母推断信号
        const sig = {
          openingAggression: mbti[0] === 'E' ? 0.75 : 0.25,
          moveIntuition: mbti[1] === 'N' ? 0.78 : 0.22,
          decisionLogic: mbti[2] === 'T' ? 0.82 : 0.25,
          endgameDecisiveness: mbti[3] === 'J' ? 0.80 : 0.22,
        };
        currentSignals = sig;
        SIGNAL_DEFS.forEach(def => {
          const input = document.querySelector(`input[data-key="${def.key}"]`);
          if (input) input.value = sig[def.key];
          const valEl = document.getElementById('val-' + def.key);
          if (valEl) valEl.textContent = sig[def.key].toFixed(2);
        });
      });
      presetsEl.appendChild(btn);
    });

    function match() {
      const coord = signalsToCoordinate(currentSignals);
      const piece = classifyPiece(coord);
      const temperament = signalsToTemperament(currentSignals);
      const ranked = matchInvestors(coord);
      const top3 = ranked.slice(0, 3);

      $('#results').innerHTML = `
        <div class="temperament-grid">
          ${CHESS_TEMPERAMENTS.map(t => `
            <div class="temp-card" style="border-color:${t.id === temperament.id ? t.color : 'var(--border)'};box-shadow:${t.id === temperament.id ? '0 0 20px ' + t.color + '22' : 'none'}">
              <div class="t-symbol" style="color:${t.color}">${t.id === 'NF' ? '🔮' : t.id === 'NT' ? '♟️' : t.id === 'SJ' ? '🏰' : '🌿'}</div>
              <div class="t-name" style="color:${t.color}">${t.name}</div>
              <div class="t-archetype">${t.chessArchetype}</div>
              <div class="t-poem">"${t.poem}"</div>
              <div style="font-size:10px;color:var(--text-muted);margin-top:4px;">${t.mbtiMembers.join(' · ')}</div>
            </div>
          `).join('')}
        </div>

        <div class="glass" style="padding:16px;margin-bottom:16px;text-align:center;">
          <div style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;">3D 坐标</div>
          <div style="font-size:18px;font-family:var(--font-mono);">
            <span style="color:#A78BFA;">X·战略 ${coord.x.toFixed(2)}</span>
            <span style="margin:0 12px;color:var(--text-muted);">|</span>
            <span style="color:#22D3EE;">Y·风险 ${coord.y.toFixed(2)}</span>
            <span style="margin:0 12px;color:var(--text-muted);">|</span>
            <span style="color:#FBBF24;">Z·攻击 ${coord.z.toFixed(2)}</span>
          </div>
          <div style="font-size:12px;margin-top:8px;">
            棋子：<span style="color:${PIECE_COLORS[piece.piece]};font-weight:600;">${piece.name} · ${piece.style}</span>
            <span style="color:var(--text-muted);margin-left:8px;">${piece.features}</span>
          </div>
        </div>

        <div style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;">Top 3 投资人匹配</div>
        <div class="investor-cards">
          ${top3.map((inv, i) => `
            <div class="investor-card" style="animation-delay:${i * 0.1}s">
              <div class="i-name" style="color:${PIECE_COLORS[inv.chessPiece]}">${inv.name}</div>
              <div class="i-en">${inv.nameEn}</div>
              <div class="i-mbti">${inv.mbti} · ${PIECE_NAMES[inv.chessPiece]} · 风险${inv.risk}% · ${inv.decisionStyle}</div>
              <div style="font-size:9px;color:var(--text-muted);margin-bottom:4px;">${inv.school} · ${inv.region}</div>
              <div class="i-tags">${inv.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
              <div class="i-quote">"${inv.quote}"</div>
              <div class="i-match">匹配度 ${(inv.score * 100).toFixed(0)}%</div>
              <div class="i-coord">坐标 (${inv.coordinate.x.toFixed(2)}, ${inv.coordinate.y.toFixed(2)}, ${inv.coordinate.z.toFixed(2)})</div>
            </div>
          `).join('')}
        </div>
      `;
    }

    match();
  </script>
  <script src="../shared/radio.js"></script>
