<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <style>
    .title { font: 20px 'Segoe UI', Roboto, sans-serif; fill:#0a0a18; font-weight:700 }
    .box { fill:#f8f9ff; stroke:#A78BFA; stroke-width:2; rx:10 }
    .shared { fill:#F3E8FF }
    .demo { fill:#E8FBFF }
    .label { font:14px 'Segoe UI', Roboto, sans-serif; fill:#0a0a18 }
    .small { font:12px 'Segoe UI', Roboto, sans-serif; fill:#0a0a18 }
    .arrow { stroke:#6b7280; stroke-width:2; fill:none; marker-end:url(#arrowhead) }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280" />
    </marker>
  </defs>

  <text x="40" y="40" class="title">Y.MINE — 仓库结构导图</text>

  <!-- Shared box -->
  <rect x="40" y="80" width="320" height="180" class="box shared" />
  <text x="60" y="110" class="label">shared/（公共模块）</text>
  <text x="60" y="135" class="small">styles.css — 全局主题样式</text>
  <text x="60" y="155" class="small">theme.js — 主题 / UI 帮手</text>
  <text x="60" y="175" class="small">vector-mock.js — 六维向量数据</text>
  <text x="60" y="195" class="small">radio.js / radio.css — 控件样式</text>

  <!-- Central vector node -->
  <rect x="420" y="120" width="360" height="90" class="box" />
  <text x="440" y="150" class="label">六维人格向量</text>
  <text x="440" y="170" class="small">shared/vector-mock.js</text>

  <!-- Arrow from shared to vector -->
  <path d="M360 170 L420 170" class="arrow" />

  <!-- Demos -->
  <rect x="820" y="20" width="320" height="80" class="box demo" />
  <text x="840" y="45" class="label">cocktail</text>
  <text x="840" y="65" class="small">风味映射 → 推荐 3 款酒</text>

  <rect x="820" y="120" width="320" height="80" class="box demo" />
  <text x="840" y="145" class="label">music</text>
  <text x="840" y="165" class="small">参数映射 → Web Audio 合成</text>

  <rect x="820" y="220" width="320" height="80" class="box demo" />
  <text x="840" y="245" class="label">chess</text>
  <text x="840" y="265" class="small">棋风坐标 → 可视化 / 匹配</text>

  <rect x="820" y="320" width="320" height="80" class="box demo" />
  <text x="840" y="345" class="label">poker</text>
  <text x="840" y="365" class="small">AI 对手参数 → 决策引擎</text>

  <rect x="820" y="420" width="320" height="80" class="box demo" />
  <text x="840" y="445" class="label">balance</text>
  <text x="840" y="465" class="small">胜率分布 & 纳什分析</text>

  <rect x="820" y="520" width="320" height="80" class="box demo" />
  <text x="840" y="545" class="label">passport</text>
  <text x="840" y="565" class="small">名片生成 & 导出（mask.js）</text>

  <!-- Arrows from vector to demos -->
  <path d="M780 165 L820 60" class="arrow" />
  <path d="M780 165 L820 160" class="arrow" />
  <path d="M780 165 L820 260" class="arrow" />
  <path d="M780 165 L820 360" class="arrow" />
  <path d="M780 165 L820 460" class="arrow" />
  <path d="M780 165 L820 560" class="arrow" />

  <!-- Arrow from vector to shared (reverse) -->
  <path d="M600 165 L560 165" class="arrow" />

  <!-- Footer note -->
  <text x="40" y="760" class="small">生成：Y.MINE 仓库结构导图 · 可下载 SVG 文件（assets/ymine-structure.svg）</text>
</svg>
