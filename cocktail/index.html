<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人格调酒 Demo · Y.MINE 人格实验室</title>
  <link rel="stylesheet" href="../shared/styles.css">
  <link rel="stylesheet" href="upgrade.css">
  <style>
    .page-header { text-align: center; padding: 40px 0 30px; }
    .page-header h1 { font-family: var(--font-display); font-size: 32px; letter-spacing: 0.06em; }
    .page-header p { color: var(--text-secondary); font-size: 13px; margin-top: 6px; }

    .layout { display: grid; grid-template-columns: 360px 1fr; gap: 24px; padding-bottom: 60px; }
    @media (max-width: 768px) { .layout { grid-template-columns: 1fr; } }

    .control-panel { padding: 20px; }
    .panel-title { font-size: 13px; color: var(--purple); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .panel-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--purple), transparent); }
    .slider-group { margin-bottom: 14px; }
    .slider-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
    .slider-label { font-size: 12px; font-weight: 600; }
    .slider-label small { font-size: 10px; opacity: 0.5; font-weight: 400; }
    .slider-value { font-size: 12px; font-family: var(--font-mono); min-width: 36px; text-align: right; }
    /* ===== 新增：双向标签 ===== */
    .slider-extremes {
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      color: var(--text-muted);
      margin-top: 1px;
      padding: 0 2px;
      letter-spacing: 0.05em;
    }
    .slider-extremes .left { text-align: left; }
    .slider-extremes .right { text-align: right; }

    .slider-desc { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
    .btn-row { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }

    .time-slot-bar { padding: 14px 16px; border-radius: var(--radius-md); background: rgba(167,139,250,0.06); border: 1px solid var(--border); margin-bottom: 20px; text-align: center; }
    .time-slot-bar .slot-label { font-size: 13px; color: var(--cyan); font-weight: 600; }
    .time-slot-bar .slot-poem { font-size: 11px; color: var(--text-secondary); font-style: italic; margin-top: 4px; }
    /* ===== 新增：时段影响提示 ===== */
    .time-impact {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(167,139,250,0.06);
      display: inline-block;
    }
    .time-impact strong { color: var(--gold); font-weight: 500; }

    .results-area { }
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .results-header .count {
      font-size: 12px;
      color: var(--text-secondary);
    }
    .results-header .count strong { color: var(--cyan); }

    .cocktail-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    @media (max-width: 1024px) { .cocktail-cards { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px) { .cocktail-cards { grid-template-columns: 1fr; } }

    .cocktail-card { padding: 20px; border-radius: var(--radius-lg); background: var(--bg-card); border: 1px solid var(--border); transition: all var(--transition); animation: fadeIn 0.5s ease-out; position: relative; overflow: hidden; }
    .cocktail-card:hover { border-color: var(--purple); box-shadow: 0 4px 20px rgba(167,139,250,0.1); }
    .cocktail-card .rank { position: absolute; top: 10px; right: 14px; font-size: 28px; font-family: var(--font-display); color: var(--purple); opacity: 0.3; }
    .cocktail-card .name { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
    .cocktail-card .name-en { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
    .cocktail-card .tagline { font-size: 11px; font-style: italic; color: var(--gold); margin-bottom: 8px; line-height: 1.4; }
    .cocktail-card .base { font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }
    .cocktail-card .abv { font-size: 11px; color: var(--cyan); font-family: var(--font-mono); margin-bottom: 4px; }
    .cocktail-card .category { font-size: 10px; color: var(--text-muted); margin-bottom: 8px; }
    .cocktail-card .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
    .cocktail-card .story { font-size: 10px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 10px; border-left: 2px solid var(--border); padding-left: 8px; }
    .cocktail-card .match { font-size: 10px; color: var(--gold); font-family: var(--font-mono); margin-bottom: 10px; }
    /* ===== 新增：匹配理由标签 ===== */
    .match-reasons {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 10px;
    }
    .match-reason {
      font-size: 9px;
      padding: 2px 8px;
      border-radius: 12px;
      background: rgba(34, 211, 238, 0.08);
      border: 1px solid rgba(34, 211, 238, 0.15);
      color: var(--cyan);
    }
    .cocktail-card .mood-tags { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; }
    .cocktail-card .mood-tag { font-size: 9px; padding: 2px 6px; border-radius: 4px; background: rgba(167,139,250,0.1); color: var(--purple); }

    /* ===== 优化：平滑展开 ===== */
    .expandable-section {
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.35s ease, opacity 0.3s ease, margin 0.3s ease;
      margin-top: 0;
    }
    .expandable-section.active {
      max-height: 600px;
      opacity: 1;
      margin-top: 10px;
    }
    .expandable-section .inner {
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .expandable-toggle {
      font-size: 10px;
      padding: 4px 12px;
      border-radius: 12px;
      background: rgba(167,139,250,0.08);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .expandable-toggle:hover {
      border-color: var(--purple);
      color: var(--text-primary);
    }
    .expandable-toggle.active {
      border-color: var(--purple);
      color: var(--purple);
      background: rgba(167,139,250,0.12);
    }

    .molecule-item { display: flex; align-items: center; justify-content: space-between; font-size: 10px; padding: 3px 0; color: var(--text-secondary); }
    .molecule-bar { width: 60px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.06); overflow: hidden; }
    .molecule-fill { height: 100%; border-radius: 2px; transition: width 0.6s ease; }
    .step-item { font-size: 10px; color: var(--text-secondary); padding: 3px 0; line-height: 1.5; }
    .step-item .step-num { color: var(--purple); font-weight: 600; margin-right: 4px; }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 13px; }
    .empty-state .big-emoji { font-size: 48px; margin-bottom: 12px; display: block; }

    .aura-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }

    /* ===== 预设按钮选中态 ===== */
    .preset-btn {
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .preset-btn.active {
      border-color: var(--cyan) !important;
      background: rgba(34,211,238,0.12) !important;
      color: var(--cyan) !important;
    }
  </style>
  <link rel="stylesheet" href="../shared/radio.css">
</head>
<body>
  <div class="container">
    <div class="nav-bar">
      <a href="../" class="nav-brand">Y.MINE 人格实验室</a>
      <a href="../" class="nav-back">← 返回入口</a>
    </div>
    <div class="page-header">
      <h1 class="text-purple">🍸 人格调酒</h1>
      <p>六维向量 → 风味偏好 → 智能推荐 3 款酒品 · 20 款精选酒库</p>
    </div>

    <div class="layout">
      <div class="control-panel glass">
        <div class="panel-title">人格向量</div>
        <div id="sliders"></div>
        <div class="btn-row">
          <button class="btn btn-primary" id="btn-random">🎲 随机生成</button>
          <button class="btn btn-gold" id="btn-recommend">🍸 推荐酒款</button>
        </div>
        <div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;" id="presets">
          <span style="font-size:10px;color:var(--text-muted);">预设：</span>
        </div>
      </div>

      <div class="results-area">
        <div class="time-slot-bar" id="time-slot">
          <div class="slot-label" id="slot-label"></div>
          <div class="slot-poem" id="slot-poem"></div>
          <div class="time-impact" id="time-impact"></div>
        </div>
        <div class="results-header">
          <span class="count">从 <strong id="library-count">20</strong> 款酒中精选 Top 3</span>
          <span style="font-size:10px;color:var(--text-muted);">⚡ 拖拽滑块即更新</span>
        </div>
        <div id="results"></div>
      </div>
    </div>
  </div>

  <script src="../shared/theme.js"></script>
  <script src="../shared/vector-mock.js"></script>
  <script>
    // ═════════════════════════════════════════════════════════
    // 酒库 · 来自主项目 cocktails.ts · 20 款精选
    // ═════════════════════════════════════════════════════════
    const BASE_SPIRIT_NAMES = { whisky: '威士忌', gin: '金酒', rum: '朗姆酒', vodka: '伏特加', tequila: '龙舌兰', liqueur: '利口酒' };
    const GLASS_NAMES = { rocks: '古典杯', coupe: '浅碟杯', martini: '马天尼杯', highball: '高球杯', mug: '玛格丽特杯', tiki: '提基杯', flute: '笛形杯' };
    const MOOD_NAMES = { elegant: '雅致', calm: '沉静', rebel: '叛逆', romantic: '浪漫', passion: '热忱', celebration: '庆典', melancholy: '怅然', mystery: '神秘' };
    const DIFFICULTY_NAMES = { 1: '简单', 2: '中等', 3: '复杂', 4: '极繁' };

    function norm(f) { return (f || 0) / 9; }

    const LIQUOR_LIBRARY = [
      { id:'old-fashioned', name:'古典之事', nameEn:'Old Fashioned', tagline:'把夜，调回它最初的样子。', base:'威士忌', baseEn:'Whisky', abv:'32%', category:'经典', difficulty:2, difficultyLabel:'中等', glass:'古典杯', garnish:'橙皮与酒渍樱桃', auraColor:'#a8842f', moods:['雅致','沉静'], archetypes:['守序者','炼金者'], story:'它诞生于一只不肯妥协的杯子，糖、苦、威士忌，三样东西便撑起一整个夜晚。守序的人懂得它的好——不必多言，每一滴都落在它该落的分毫里。', flavor:{ sweet:norm(3),sour:norm(0),bitter:norm(5),strong:norm(7),smoky:norm(4),fruity:norm(0),herbal:norm(2),creamy:norm(1) }, ingredients:[{name:'波本威士忌',amt:'60ml'},{name:'安高天娜苦精',amt:'2 dashes'},{name:'安高天娜苦精（橙味）',amt:'1 dash'},{name:'方糖',amt:'1 块'},{name:'清水',amt:'1 茶匙'}], steps:['将方糖置于古典杯底，滴入苦精与清水，用吧匙碾搅至糖化。','加入威士忌，缓缓搅匀使糖与酒融合。','投入一大块老冰，搅拌约 20 秒至杯壁冰凉。','将橙皮油脂挤落于杯面，弃皮或留作装饰，缀以酒渍樱桃。'] },
      { id:'negroni', name:'涩格罗尼', nameEn:'Negroni', tagline:'一半是夜，一半是不肯熄的火。', base:'金酒', baseEn:'Gin', abv:'28%', category:'经典', difficulty:1, difficultyLabel:'简单', glass:'古典杯', garnish:'橙皮', auraColor:'#c97b5a', moods:['叛逆','雅致'], archetypes:['守序者','夜唤者'], story:'佛罗伦萨的伯爵要一杯比美国佬更烈的酒，于是金酒、苦味酒、甜威末等比相会。它是叛逆里的守序——三股锋芒，谁也不肯让谁，却在杯中达成一种冷峻的平衡。', flavor:{ sweet:norm(1),sour:norm(1),bitter:norm(8),strong:norm(7),smoky:norm(1),fruity:norm(2),herbal:norm(3),creamy:norm(0) }, ingredients:[{name:'金酒',amt:'30ml'},{name:'金巴利',amt:'30ml'},{name:'甜红威末',amt:'30ml'}], steps:['将三种材料依次倒入古典杯。','加入大块老冰，搅拌约 20 秒至充分冰透。','将橙皮油脂喷于杯面，扭转后投入杯中作装饰。'] },
      { id:'margarita', name:'玛格丽特', nameEn:'Margarita', tagline:'盐边之上，是吻过夜的酸。', base:'龙舌兰', baseEn:'Tequila', abv:'22%', category:'经典', difficulty:2, difficultyLabel:'中等', glass:'玛格丽特杯', garnish:'青柠轮与盐边', auraColor:'#9b7bd4', moods:['浪漫','热忱'], archetypes:['月潮者','焰心者'], story:'相传它为一位名叫玛格丽特的女子而生，盐是泪的隐喻，酸是思念的形状。浪漫的人端起它，总能在龙舌兰的锋后尝到一缕温柔的果香，像回忆里不肯褪色的那一笔。', flavor:{ sweet:norm(2),sour:norm(6),bitter:norm(1),strong:norm(6),smoky:norm(0),fruity:norm(5),herbal:norm(1),creamy:norm(0) }, ingredients:[{name:'银龙舌兰',amt:'45ml'},{name:'橙味利口酒（君度）',amt:'20ml'},{name:'鲜青柠汁',amt:'20ml'},{name:'盐',amt:'适量（杯口）'}], steps:['用青柠角湿润浅碟杯口半圈，倒扣于盐上沾出盐边。','将龙舌兰、橙酒与青柠汁加入摇酒壶，加冰摇匀至壶壁结霜。','滤入备好的盐边杯，缀以青柠轮。'] },
      { id:'mojito', name:'莫吉托', nameEn:'Mojito', tagline:'把一整座夏夜，揉碎进杯里。', base:'朗姆酒', baseEn:'Rum', abv:'13%', category:'经典', difficulty:2, difficultyLabel:'中等', glass:'高球杯', garnish:'薄荷嫩尖与青柠角', auraColor:'#7c5fbf', moods:['热忱','庆典'], archetypes:['焰心者','月潮者'], story:'哈瓦那的薄荷叶与朗姆在杯中相遇，气泡升腾如夜里的笑声。它属于那些把热度递给世界的人——明亮、清新，却在草本深处藏着一缕让人安定的绿。', flavor:{ sweet:norm(3),sour:norm(4),bitter:norm(1),strong:norm(4),smoky:norm(0),fruity:norm(4),herbal:norm(8),creamy:norm(0) }, ingredients:[{name:'白朗姆',amt:'50ml'},{name:'鲜青柠汁',amt:'20ml'},{name:'甘蔗糖浆',amt:'15ml'},{name:'薄荷叶',amt:'8-10 片'},{name:'苏打水',amt:'适量'}], steps:['将薄荷叶与糖浆置于高球杯底，轻轻捣压释出香气，勿捣至发苦。','加入青柠汁与白朗姆，搅匀。','杯中加满碎冰，注入苏打水至近满。','用吧勺自下而上提拉搅拌，缀以薄荷嫩尖。'] },
      { id:'manhattan', name:'曼哈顿', nameEn:'Manhattan', tagline:'一杯之间，已是整座夜城。', base:'威士忌', baseEn:'Whisky', abv:'30%', category:'经典', difficulty:2, difficultyLabel:'中等', glass:'浅碟杯', garnish:'酒渍樱桃', auraColor:'#d4a84b', moods:['雅致','神秘'], archetypes:['守序者','暮色者'], story:'丘吉尔之母的宴会桌上，它第一次被举起。黑麦的烈、甜威末的柔、苦精的锋，恰是夜城里那种不喧不闹却句句有力的雅致。', flavor:{ sweet:norm(3),sour:norm(0),bitter:norm(4),strong:norm(8),smoky:norm(2),fruity:norm(1),herbal:norm(3),creamy:norm(1) }, ingredients:[{name:'黑麦威士忌',amt:'60ml'},{name:'甜红威末',amt:'25ml'},{name:'安高天娜苦精',amt:'2 dashes'}], steps:['将三种材料加入调酒杯，加冰搅拌约 20 秒至冰透。','滤入冰镇浅碟杯。','以酒渍樱桃沉底或缀于杯沿作装饰。'] },
      { id:'dry-martini', name:'干马天尼', nameEn:'Dry Martini', tagline:'少即是夜的全部。', base:'金酒', baseEn:'Gin', abv:'34%', category:'经典', difficulty:3, difficultyLabel:'复杂', glass:'马天尼杯', garnish:'柠檬皮扭或绿橄榄', auraColor:'#d8c9f5', moods:['雅致','沉静'], archetypes:['炼金者','守序者'], story:'金酒与干威末的比例之争，是调酒界最久的角力。它属于有耐心的人——把纷繁炼至两样材料，再用一颗橄榄封住夜的沉默。', flavor:{ sweet:norm(0),sour:norm(1),bitter:norm(3),strong:norm(8),smoky:norm(0),fruity:norm(0),herbal:norm(6),creamy:norm(0) }, ingredients:[{name:'伦敦干金酒',amt:'60ml'},{name:'干味美思',amt:'10ml'},{name:'橙味苦精（可选）',amt:'1 dash'}], steps:['将金酒、干威末与苦精加入调酒杯，加冰搅拌约 25 秒至极冰。','滤入冰镇马天尼杯。','将柠檬皮油脂喷于杯面后弃皮，或以一颗绿橄榄沉入作饰。'] },
      { id:'espresso-martini', name:'浓缩马天尼', nameEn:'Espresso Martini', tagline:'醒与醉，在杯中谈判。', base:'伏特加', baseEn:'Vodka', abv:'24%', category:'创意', difficulty:3, difficultyLabel:'复杂', glass:'浅碟杯', garnish:'咖啡豆三粒', auraColor:'#5d44a0', moods:['庆典','热忱'], archetypes:['焰心者','夜唤者'], story:'一位模特说"我要一杯能让我醒来的酒"，于是伏特加与浓缩咖啡在摇壶里相遇。苦与润交织，泡沫如夜的礼花，是庆典里的一记清醒。', flavor:{ sweet:norm(4),sour:norm(1),bitter:norm(5),strong:norm(6),smoky:norm(1),fruity:norm(0),herbal:norm(0),creamy:norm(6) }, ingredients:[{name:'伏特加',amt:'50ml'},{name:'浓缩咖啡',amt:'30ml（现萃）'},{name:'咖啡利口酒',amt:'20ml'},{name:'甘蔗糖浆',amt:'10ml'}], steps:['将所有材料加入摇酒壶，加冰用力摇匀约 15 秒以打出绵密泡沫。','双层滤入冰镇浅碟杯，使表面浮起一层细沫。','于泡沫上轻放三粒咖啡豆作装饰。'] },
      { id:'pina-colada', name:'椰林飘香', nameEn:'Piña Colada', tagline:'把夜，调成一片会发光的海。', base:'朗姆酒', baseEn:'Rum', abv:'14%', category:'经典', difficulty:2, difficultyLabel:'中等', glass:'提基杯', garnish:'菠萝叶与酒渍樱桃', auraColor:'#f0c674', moods:['浪漫','庆典'], archetypes:['月潮者','暮色者'], story:'波多黎各的海风把椰浆与菠萝揉进朗姆里。它是夜最柔软的一面——甜、润、果香缠绵，像一段不必清醒的浪漫。', flavor:{ sweet:norm(7),sour:norm(2),bitter:norm(0),strong:norm(4),smoky:norm(0),fruity:norm(6),herbal:norm(0),creamy:norm(9) }, ingredients:[{name:'白朗姆',amt:'50ml'},{name:'椰浆',amt:'30ml'},{name:'菠萝汁',amt:'60ml'},{name:'淡奶油',amt:'15ml'}], steps:['将所有材料加入摇酒壶，加冰摇匀至充分融合。','连同碎冰倒入提基杯，或滤入冰镇杯中。','以菠萝叶与酒渍樱桃缀于杯沿作装饰。'] },

      { id:'wool-sweater', name:'毛衣', nameEn:'Wool Sweater', tagline:'穿在身上的温度。', base:'威士忌', baseEn:'Whisky', abv:'22%', category:'原创', difficulty:3, difficultyLabel:'复杂', glass:'古典杯', garnish:'肉豆蔻粉撒面与一小枝百里香', auraColor:'#e0b85e', moods:['沉静','浪漫'], archetypes:['月潮者','雾行者'], story:'这是一杯"穿在身上的酒"——爱尔兰威士忌的温润打底，蜂蜜和榛子像冬日的暖阳，奶油带来柔软包裹感，一点点柠檬提鲜不让甜腻泛滥。就像 ISFJ，总是用最温柔的方式照顾身边每一个人，不张扬、不抢眼，但你知道只要 TA 在，就不会冷。', flavor:{ sweet:norm(6),sour:norm(2),bitter:norm(1),strong:norm(4),smoky:norm(0),fruity:norm(2),herbal:norm(3),creamy:norm(7) }, ingredients:[{name:'爱尔兰威士忌',amt:'40ml'},{name:'蜂蜜糖浆',amt:'15ml'},{name:'榛子利口酒 Frangelico',amt:'10ml'},{name:'鲜榨柠檬汁',amt:'10ml'},{name:'浓奶油',amt:'15ml'},{name:'蛋清',amt:'半个（约15ml，可选）'}], steps:['将所有材料加入摇酒壶，先无冰干摇 15 秒使蛋清起泡。','加入冰块再摇 15 秒至冰透绵密。','滤入装有大方冰的古典杯，表面撒肉豆蔻粉，缀以一小枝百里香。'] },
      { id:'chain-of-command', name:'军令', nameEn:'Chain of Command', tagline:'一杯酒，就是一个决定。', base:'威士忌', baseEn:'Whisky', abv:'35%', category:'原创', difficulty:4, difficultyLabel:'极繁', glass:'古典杯', garnish:'柠檬皮扭（喷香后放入）', auraColor:'#7c4a3a', moods:['雅致','神秘'], archetypes:['领航者','守序者'], story:'双威士忌基底奠定力量感的基调，金巴利和甜味美思构成苦甜平衡的中层，苦精与茴香洗杯带来直击鼻腔的冲击力——每一层都有明确的分工，像一支纪律严明的军队。这不是一杯用来"小酌"的酒，这是一杯用来"做决定"的酒。喝下去，你就是那个发号施令的人。', flavor:{ sweet:norm(2),sour:norm(0),bitter:norm(6),strong:norm(9),smoky:norm(6),fruity:norm(0),herbal:norm(4),creamy:norm(0) }, ingredients:[{name:'烟熏苏格兰威士忌',amt:'30ml'},{name:'黑麦威士忌',amt:'20ml'},{name:'金巴利',amt:'15ml'},{name:'甜味美思',amt:'10ml'},{name:'安格斯特拉苦精',amt:'3 dashes'},{name:'茴香酒 Pernod',amt:'洗杯用'}], steps:['用茴香酒润冰镇古典杯内壁后倒出，使杯壁附着一层茴香气息。','将双威士忌、金巴利、甜味美思与苦精加入调酒杯，加冰搅拌约 25 秒至冰透。','滤入备好的古典杯，放一块大方冰，将柠檬皮油脂喷于杯面后扭入杯中。'] },
      { id:'the-host', name:'派对主持', nameEn:'The Host', tagline:'让每个人都开心的魔法。', base:'朗姆酒', baseEn:'Rum', abv:'14%', category:'原创', difficulty:2, difficultyLabel:'中等', glass:'笛形杯', garnish:'西柚片、百香果半颗与薄荷叶', auraColor:'#f0a050', moods:['热忱','庆典'], archetypes:['焰心者','月潮者'], story:'热带水果的热情开场，西柚的微苦增加层次，气泡带来轻盈的社交感——这是一杯"让所有人都喜欢"的酒。酒精度不高，颜值在线，入口友好，谁都能喝两杯，就像 ESFJ 总能照顾到在场每个人的感受。', flavor:{ sweet:norm(5),sour:norm(4),bitter:norm(2),strong:norm(3),smoky:norm(0),fruity:norm(8),herbal:norm(1),creamy:norm(0) }, ingredients:[{name:'白朗姆酒',amt:'30ml'},{name:'蜜桃利口酒',amt:'15ml'},{name:'西柚汁',amt:'20ml'},{name:'百香果糖浆',amt:'10ml'},{name:'青柠汁',amt:'10ml'},{name:'普罗塞克起泡酒',amt:'30ml（顶部加满）'}], steps:['将白朗姆、蜜桃利口酒、西柚汁、百香果糖浆与青柠汁加入摇酒壶，加冰摇匀至壶壁结霜。','滤入冰镇笛形杯。','缓缓注入普罗塞克至近满，缀以西柚片、百香果半颗与薄荷叶。'] },
    ];

    // ═════════════════════════════════════════════════════════
    // 维度双向标签配置
    // ═════════════════════════════════════════════════════════
    const DIM_LABELS = {
      TOL: { left: '清爽·简单', right: '复杂·烟熏' },
      SPD: { left: '温和·低度', right: '强烈·高度' },
      INF: { left: '内敛·草本', right: '张扬·果香' },
      ENT: { left: '轻盈·淡', right: '浓烈·刺激' },
      LEAD: { left: '随性·自然', right: '经典·结构' },
      VIS: { left: '朴素·实用', right: '华丽·装饰' }
    };

    // ═════════════════════════════════════════════════════════
    // 初始化
    // ═════════════════════════════════════════════════════════
    const DEFAULT_VEC = { TOL: 0.35, SPD: 0.55, INF: 0.85, ENT: 0.25, LEAD: 0.80, VIS: 0.60 };
    let currentVector = { ...DEFAULT_VEC };
    let activePreset = null;

    // ---- 防抖工具 ----
    function debounce(fn, delay = 300) {
      let timer = null;
      return (...args) => {
        if (timer) clearTimeout(timer);
        timer = setTimeout(() => { fn(...args); timer = null; }, delay);
      };
    }

    // ---- 滑块渲染（带双向标签） ----
    const sliderValues = createVectorSliders($('#sliders'), (vals) => {
      currentVector = { ...vals };
      // 清除预设高亮
      document.querySelectorAll('.preset-btn').forEach(el => el.classList.remove('active'));
      activePreset = null;
      // 防抖推荐
      debouncedRecommend();
    }, DEFAULT_VEC);

    // 在滑块下方插入双向标签
    document.querySelectorAll('.slider-group').forEach(group => {
      const dim = group.querySelector('input')?.dataset.dim;
      if (dim && DIM_LABELS[dim]) {
        const lbl = DIM_LABELS[dim];
        const div = document.createElement('div');
        div.className = 'slider-extremes';
        div.innerHTML = `<span class="left">${lbl.left}</span><span class="right">${lbl.right}</span>`;
        group.appendChild(div);
      }
    });

    // ---- 预设按钮 ----
    const presetsEl = $('#presets');
    const presetNames = getPresetTypes ? getPresetTypes() : ['INTJ','ENFP','ISTJ','ESFP','INFJ','ENTP'];
    presetNames.forEach(type => {
      const btn = document.createElement('button');
      btn.className = 'tag preset-btn';
      btn.textContent = type;
      btn.dataset.preset = type;
      btn.addEventListener('click', () => {
        const vec = presetVector ? presetVector(type) : randomVector();
        currentVector = { ...vec };
        DIMENSIONS.forEach(d => {
          const input = document.querySelector(`input[data-dim="${d.key}"]`);
          if (input) { input.value = vec[d.key]; const valEl = input.parentElement.querySelector('.slider-value'); if (valEl) valEl.textContent = fmt(vec[d.key]); }
        });
        // 高亮当前预设
        document.querySelectorAll('.preset-btn').forEach(el => el.classList.remove('active'));
        btn.classList.add('active');
        activePreset = type;
        debouncedRecommend();
      });
      presetsEl.appendChild(btn);
    });

    // ---- 按钮事件 ----
    $('#btn-random').addEventListener('click', () => {
      const vec = randomVector();
      currentVector = { ...vec };
      DIMENSIONS.forEach(d => {
        const input = document.querySelector(`input[data-dim="${d.key}"]`);
        if (input) { input.value = vec[d.key]; const valEl = input.parentElement.querySelector('.slider-value'); if (valEl) valEl.textContent = fmt(vec[d.key]); }
      });
      document.querySelectorAll('.preset-btn').forEach(el => el.classList.remove('active'));
      activePreset = null;
      debouncedRecommend();
    });

    $('#btn-recommend').addEventListener('click', () => {
      recommend();
    });

    // ---- 时段渲染 ----
    renderTimeSlot();

    function renderTimeSlot() {
      const slot = getCurrentTimeSlot();
      const slotLabel = document.getElementById('slot-label');
      const slotPoem = document.getElementById('slot-poem');
      const slotImpact = document.getElementById('time-impact');
      if (slotLabel) slotLabel.textContent = `${slot.label} · ${slot.mood}`;
      if (slotPoem) slotPoem.textContent = `"${slot.poem}"`;
      if (slotImpact) {
        const impacts = {
          midnight: '🌙 午夜时段 → 倾向推荐 复杂、经典 酒款',
          dusk: '🌅 黄昏时段 → 倾向推荐 浪漫、果香 酒款',
          dawn: '🌄 黎明时段 → 倾向推荐 清爽、草本 酒款'
        };
        slotImpact.innerHTML = impacts[slot.slot] || '🌙 时段加成已生效';
      }
    }

    // ═════════════════════════════════════════════════════════
    // 推荐逻辑（余弦相似度 + 时段加成）
    // ═════════════════════════════════════════════════════════
    function vectorToFlavor(vec) {
      // 将六维向量映射到八维 flavor（简化映射）
      return {
        sweet: vec.INF * 0.7 + vec.SPD * 0.3,
        sour: (1 - vec.LEAD) * 0.6 + vec.SPD * 0.4,
        bitter: vec.TOL * 0.8 + vec.ENT * 0.2,
        strong: vec.ENT * 0.8 + vec.TOL * 0.2,
        smoky: vec.TOL * 0.9,
        fruity: vec.INF * 0.9,
        herbal: (1 - vec.INF) * 0.7 + vec.LEAD * 0.3,
        creamy: (1 - vec.ENT) * 0.5 + vec.VIS * 0.5
      };
    }

    function cosineSimilarity(a, b) {
      const keys = Object.keys(a);
      let dot = 0, normA = 0, normB = 0;
      for (const k of keys) {
        dot += a[k] * b[k];
        normA += a[k] * a[k];
        normB += b[k] * b[k];
      }
      if (normA === 0 || normB === 0) return 0;
      return dot / (Math.sqrt(normA) * Math.sqrt(normB));
    }

    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

    // ===== 新增：生成匹配理由 =====
    function getMatchReasons(cocktail, userFlavor, slot) {
      const reasons = [];
      const flavorKeys = ['sweet','sour','bitter','strong','smoky','fruity','herbal','creamy'];
      const flavorLabels = {
        sweet: '🍬 甜度',
        sour: '🍋 酸度',
        bitter: '🔥 苦味',
        strong: '💪 酒体',
        smoky: '🌫️ 烟熏',
        fruity: '🍊 果香',
        herbal: '🌿 草本',
        creamy: '🥛 醇厚'
      };
      // 找出最匹配的 2-3 个维度
      const diffs = flavorKeys.map(k => ({
        key: k,
        diff: Math.abs(userFlavor[k] - cocktail.flavor[k]),
        weight: Math.max(userFlavor[k], cocktail.flavor[k]) // 高值维度优先
      }));
      diffs.sort((a, b) => (a.diff * 0.7 + (1 - a.weight) * 0.3) - (b.diff * 0.7 + (1 - b.weight) * 0.3));
      const top = diffs.slice(0, 3);
      for (const d of top) {
        if (d.diff < 0.35) {
          const label = flavorLabels[d.key] || d.key;
          const userVal = userFlavor[d.key];
          const cocktailVal = cocktail.flavor[d.key];
          const dir = cocktailVal > userVal ? '偏高' : '偏低';
          reasons.push(`${label} ${dir}（${(cocktailVal * 100).toFixed(0)}%）`);
        }
      }
      // 如果理由太少，补一个时段或类别
      if (reasons.length < 2) {
        if (slot === 'midnight' && cocktail.difficulty >= 3) reasons.push('🌙 午夜·复杂酒款加分');
        if (slot === 'dusk' && cocktail.moods.includes('浪漫')) reasons.push('🌅 黄昏·浪漫酒款加分');
        if (slot === 'dawn' && cocktail.category === '经典') reasons.push('🌄 黎明·经典酒款加分');
        if (reasons.length < 2 && cocktail.moods.length) reasons.push(`🎭 气质匹配 · ${cocktail.moods[0]}`);
      }
      return reasons.slice(0, 4);
    }

    // ---- 防抖推荐包装 ----
    const debouncedRecommend = debounce(() => recommend(), 280);

    function recommend() {
      const vec = currentVector;
      const userFlavor = vectorToFlavor(vec);
      const slot = getCurrentTimeSlot();

      const scored = LIQUOR_LIBRARY.map(cocktail => {
        const flavorScore = cosineSimilarity(userFlavor, cocktail.flavor);
        let timeBonus = 0;
        if (slot.slot === 'midnight' && cocktail.difficulty >= 3) timeBonus = 0.05;
        if (slot.slot === 'dawn' && cocktail.category === '经典') timeBonus = 0.03;
        if (slot.slot === 'dusk' && cocktail.moods.includes('浪漫')) timeBonus = 0.04;
        const score = clamp(flavorScore + timeBonus, 0, 1);
        return { ...cocktail, score, flavorScore };
      });

      scored.sort((a, b) => b.score - a.score);
      const top3 = scored.slice(0, 3);
      renderResults(top3, userFlavor, slot);
    }

    // ═════════════════════════════════════════════════════════
    // 结果渲染（含匹配理由 + 平滑展开）
    // ═════════════════════════════════════════════════════════
    function renderResults(cocktails, userFlavor, slot) {
      const resultsEl = $('#results');
      document.getElementById('library-count').textContent = LIQUOR_LIBRARY.length;

      if (!cocktails || !cocktails.length) {
        resultsEl.innerHTML = '<div class="empty-state"><span class="big-emoji">🍸</span>调整向量后点击「推荐酒款」</div>';
        return;
      }

      resultsEl.innerHTML = `
        <div class="cocktail-cards">
          ${cocktails.map((c, i) => {
            const reasons = userFlavor ? getMatchReasons(c, userFlavor, slot) : [];
            return `
            <div class="cocktail-card" style="animation-delay:${i * 0.1}s;border-left:3px solid ${c.auraColor};">
              <div class="rank">#${i + 1}</div>
              <div class="name">${c.name}</div>
              <div class="name-en">${c.nameEn}</div>
              <div class="tagline">${c.tagline}</div>
              <div class="base"><span class="aura-dot" style="background:${c.auraColor};"></span>${c.base} / ${c.baseEn} · ${c.glass} · ${c.difficultyLabel}</div>
              <div class="abv">ABV ${c.abv} · ${c.category}</div>
              <div class="mood-tags">${c.moods.map(m => `<span class="mood-tag">${m}</span>`).join('')}</div>
              <div class="story">${c.story}</div>
              <div class="match">匹配度 ${(c.score * 100).toFixed(0)}% · 风味相似 ${(c.flavorScore * 100).toFixed(0)}%</div>
              ${reasons.length ? `<div class="match-reasons">${reasons.map(r => `<span class="match-reason">${r}</span>`).join('')}</div>` : ''}
              <div style="display:flex;gap:6px;flex-wrap:wrap;">
                <button class="expandable-toggle" data-target="mol-${c.id}" onclick="toggleExpand('mol-${c.id}', this)">🔬 分子视图</button>
                <button class="expandable-toggle" data-target="steps-${c.id}" onclick="toggleExpand('steps-${c.id}', this)">📋 调酒步骤</button>
              </div>
              <div class="expandable-section" id="mol-${c.id}">
                <div class="inner">
                  ${c.ingredients.map((ing, j) => {
                    const colors = ['#A78BFA','#22D3EE','#FBBF24','#F87171','#34D399','#F472B6'];
                    const pct = Math.round(100 / c.ingredients.length);
                    return `<div class="molecule-item"><span>${ing.name}</span><div class="molecule-bar"><div class="molecule-fill" style="width:${pct}%;background:${colors[j % colors.length]};"></div></div><span style="color:${colors[j % colors.length]}">${ing.amt}</span></div>`;
                  }).join('')}
                </div>
              </div>
              <div class="expandable-section" id="steps-${c.id}">
                <div class="inner">
                  ${c.steps.map((s, j) => `<div class="step-item"><span class="step-num">${j + 1}.</span>${s}</div>`).join('')}
                </div>
              </div>
            </div>
          `}).join('')}
        </div>
      `;
    }

    // ---- 平滑展开切换 ----
    window.toggleExpand = function(id, btn) {
      const el = document.getElementById(id);
      if (!el) return;
      const isActive = el.classList.toggle('active');
      btn.classList.toggle('active');
      if (id.startsWith('mol-')) {
        btn.textContent = isActive ? '🍸 收起分子' : '🔬 分子视图';
      } else if (id.startsWith('steps-')) {
        btn.textContent = isActive ? '📋 收起步骤' : '📋 调酒步骤';
      }
    };

    // ---- 初始渲染 ----
    recommend();
  </script>
  <script src="../shared/radio.js"></script>
</body>
</html>
